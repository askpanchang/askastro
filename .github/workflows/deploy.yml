# CI on every pull request; on pushes to main, also apply D1 migrations and
# deploy the Worker. Needs repository secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID. The ACCESS_AUD Worker secret persists across deploys.
name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a deploy half-way through; superseded PR checks can go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  deploy:
    name: Migrate and deploy
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Migrations first: they only add columns/tables, so the old Worker keeps working.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
      - name: Build
        run: npm run build
      - name: Deploy
        run: npx wrangler deploy
      - name: Smoke check (Access must be in front of the app)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://kundali-studio.askpanchang.workers.dev/)
          echo "GET / -> $code"
          test "$code" = "302"
